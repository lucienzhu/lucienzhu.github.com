<figure class="royale-figure">
  <a href="{{ include.full | default: include.src }}" target="_blank" rel="noopener" aria-label="{{ include.alt | escape }} — {% if page.lang == 'zh-CN' %}查看原图{% else %}View full image{% endif %}">
    <img src="{{ include.src }}" alt="{{ include.alt | escape }}" width="{{ include.width }}" height="{{ include.height }}" loading="lazy" decoding="async">
  </a>
  <figcaption>{{ include.caption }}</figcaption>
</figure>
