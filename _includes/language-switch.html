<nav class="language-switch" aria-label="{{ t.language_switch }}">
  <a href="{{ english_url | relative_url }}" lang="en" hreflang="en" data-language-link{% if locale == 'en' %} aria-current="true"{% endif %}>EN</a>
  <a href="{{ chinese_url | relative_url }}" lang="zh-CN" hreflang="zh-CN" data-language-link{% if locale == 'zh' %} aria-current="true"{% endif %}>中文</a>
</nav>
