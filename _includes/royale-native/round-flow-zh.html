<div class="rn-flow-figure"><h3>一轮，两次攻防</h3><ol class="rn-flow"><li><span class="rn-step-num">01</span><div><strong>你进攻</strong><p>选 3 张，或 4 / 5 张炸弹。</p></div></li><li><span class="rn-step-num">02</span><div><strong>对手防守</strong><p>看过你的牌，再出牌应对。</p></div></li><li><span class="rn-step-num">03</span><div><strong>结算</strong><p>进攻赢：造成伤害。防守赢：获得换牌机会。</p></div></li><li><span class="rn-step-num">04</span><div><strong>交换攻守</strong><p>对手进攻，你来防守。此时不补手牌。</p></div></li><li><span class="rn-step-num">05</span><div><strong>轮末补牌</strong><p>保留未用的牌，双方手牌补至 8 张。</p></div></li></ol><p class="rn-callout">任何一次结算达到 5 伤，立即结束小局。</p></div>
