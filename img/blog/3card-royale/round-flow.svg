<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1000" viewBox="0 0 560 1000" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">攻防循环与本局终止条件</title><desc id="desc">攻防循环与本局终止条件. 深圳花牌文章图解。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="1000" fill="#EDF4EF"/><text x="24" y="48" font-size="32" fill="#10231B" font-weight="700" text-anchor="start">一轮，两次攻防</text><rect x="24" y="80" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="124" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">01</text><text x="104" y="123" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">进攻者亮牌</text><text x="104" y="159" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">三张 / 四炸 / 五炸</text><path d="M280 180v26m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="220" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="264" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">02</text><text x="104" y="263" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">防守者回应</text><text x="104" y="299" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">看见进攻牌，再决定</text><path d="M280 320v26m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="360" width="512" height="196" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="402" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">03  比较与结算</text><text x="48" y="448" font-size="27" fill="#B2365A" font-weight="600" text-anchor="start">攻赢 → 对手加伤</text><text x="48" y="489" font-size="27" fill="#866300" font-weight="600" text-anchor="start">守赢 → 可选换牌</text><text x="48" y="530" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">完全平手 → 无收益</text><path d="M280 556v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="594" width="512" height="72" rx="12" fill="#F6E0E7" stroke="none"/><text x="280" y="638" font-size="28" fill="#B2365A" font-weight="700" text-anchor="middle">达到 5 伤 → 本局结束</text><text x="280" y="708" font-size="24" fill="#4F665A" font-weight="500" text-anchor="middle">否则继续 ↓</text><rect x="24" y="738" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="782" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">04</text><text x="104" y="781" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">交换攻守</text><text x="104" y="817" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">再做 01—03，中间不补手牌</text><path d="M280 838v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="876" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="920" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">05</text><text x="104" y="919" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">轮末补到 8 张</text><text x="104" y="955" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">保留未用牌，开始下一轮</text></svg>
