<svg xmlns="http://www.w3.org/2000/svg" width="560" height="936" viewBox="0 0 560 936" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">行为克隆基线的训练与部署流程</title><desc id="desc">行为克隆基线的训练与部署流程. 深圳花牌文章图解。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="936" fill="#EDF4EF"/><text x="24" y="48" font-size="31" fill="#10231B" font-weight="700" text-anchor="start">从自对弈到浏览器</text><rect x="24" y="80" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="125" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">01</text><text x="104" y="124" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Code AI × Code AI</text><text x="104" y="164" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">10,000 小局 · 252,859 决策</text><path d="M280 192v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="230" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="275" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">02</text><text x="104" y="274" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">按完整小局切分</text><text x="104" y="314" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">训练 8,000 / 验证 1,000 / 测试 1,000</text><path d="M280 342v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="425" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">03</text><text x="104" y="424" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">PyTorch + TensorBoard</text><text x="104" y="464" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">行为克隆 · 336 + 72 → 256 → 128 → 1</text><path d="M280 492v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="530" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="575" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">04</text><text x="104" y="574" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">按验证损失选 checkpoint</text><text x="104" y="614" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">第 5 轮 · 再用留出集与对战评估</text><path d="M280 642v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="680" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="725" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">05</text><text x="104" y="724" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">ONNX → Web Worker</text><text x="104" y="764" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">0.55 MB 权重 · 浏览器本地推理</text><rect x="24" y="822" width="512" height="88" rx="12" fill="#E2ECE5" stroke="none"/><text x="48" y="859" font-size="25" fill="#10231B" font-weight="600" text-anchor="start">已上线：学习 Code AI 的选择</text><text x="48" y="893" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">下一步：用胜负奖励做强化学习</text></svg>
