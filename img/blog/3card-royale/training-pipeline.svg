<svg xmlns="http://www.w3.org/2000/svg" width="560" height="936" viewBox="0 0 560 936" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">两种行为克隆基线的训练与部署流程</title><desc id="desc">两种行为克隆基线的训练与部署流程. 深圳花牌文章图解。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="936" fill="#EDF4EF"/><text x="24" y="48" font-size="31" fill="#10231B" font-weight="700" text-anchor="start">从自对弈到浏览器</text><rect x="24" y="80" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="125" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">01</text><text x="104" y="124" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">SDK Code AI × SDK Code AI</text><text x="104" y="164" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">每套配方 10,000 小局</text><path d="M280 192v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="230" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="275" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">02</text><text x="104" y="274" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">按完整小局切分</text><text x="104" y="314" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">训练 8,000 / 验证 1,000 / 测试 1,000</text><path d="M280 342v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="512" height="132" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="422" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">03</text><text x="104" y="422" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">PyTorch + TensorBoard</text><text x="104" y="459" font-size="21" fill="#4F665A" font-weight="500" text-anchor="start">整手评分：408 → 256 → 128 → 1</text><text x="104" y="491" font-size="21" fill="#4F665A" font-weight="500" text-anchor="start">自回归：732 → 256 → 128 → 65</text><path d="M280 512v18m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="548" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="593" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">04</text><text x="104" y="592" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">按验证损失选模</text><text x="104" y="632" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">整手评分 Epoch 5 · 自回归 Epoch 16</text><path d="M280 660v22m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="700" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="745" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">05</text><text x="104" y="744" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">ONNX → Web Worker</text><text x="104" y="784" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">0.55 / 0.92 MB · 浏览器本地推理</text><rect x="24" y="842" width="512" height="66" rx="12" fill="#E2ECE5" stroke="none"/><text x="280" y="883" font-size="26" fill="#10231B" font-weight="700" text-anchor="middle">actions-v2</text></svg>
