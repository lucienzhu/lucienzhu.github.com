<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title" xml:lang="en"><title id="title">From a policy to a playable opponent</title><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="690" fill="#EDF4EF"/><text x="28" y="43" font-size="14" font-weight="700" fill="#B2365A">AI ARENA / 1.1</text><text x="28" y="82" font-size="24" font-weight="700" fill="#122820">From a policy to a playable opponent</text><rect x="28" y="108" width="504" height="110" rx="14" fill="#F7FBF8" stroke="#C3D5CB"/><text x="46" y="139" font-size="16" font-weight="700" fill="#B2365A">01</text><text x="87" y="140" font-size="22" font-weight="700" fill="#122820">Build &amp; validate</text><text x="87" y="170" font-size="18" font-weight="500" fill="#50695C">JavaScript or ONNX · new policy ID</text><text x="87" y="195" font-size="18" font-weight="500" fill="#50695C">4 games vs Code AI → validation.json</text><path d="M280 221v12m-5-5 5 5 5-5" fill="none" stroke="#8EAA9B" stroke-width="2"/><rect x="28" y="238" width="504" height="110" rx="14" fill="#F7FBF8" stroke="#C3D5CB"/><text x="46" y="269" font-size="16" font-weight="700" fill="#B2365A">02</text><text x="87" y="270" font-size="22" font-weight="700" fill="#122820">Submit a PR</text><text x="87" y="300" font-size="18" font-weight="500" fill="#50695C">CI replays the four validation games</text><text x="87" y="325" font-size="18" font-weight="500" fill="#50695C">Checks playability; no Elo yet</text><path d="M280 351v12m-5-5 5 5 5-5" fill="none" stroke="#8EAA9B" stroke-width="2"/><rect x="28" y="368" width="504" height="110" rx="14" fill="#F7FBF8" stroke="#C3D5CB"/><text x="46" y="399" font-size="16" font-weight="700" fill="#B2365A">03</text><text x="87" y="400" font-size="22" font-weight="700" fill="#122820">Publish &amp; rate</text><text x="87" y="430" font-size="18" font-weight="500" fill="#50695C">After merge: release or manual run</text><text x="87" y="455" font-size="18" font-weight="500" fill="#50695C">3 fixed references × 20 games = 60</text><path d="M280 481v12m-5-5 5 5 5-5" fill="none" stroke="#8EAA9B" stroke-width="2"/><rect x="28" y="498" width="504" height="110" rx="14" fill="#E2ECE5" stroke="#C3D5CB"/><text x="46" y="529" font-size="16" font-weight="700" fill="#B2365A">04</text><text x="87" y="530" font-size="22" font-weight="700" fill="#122820">Leaderboard &amp; play</text><text x="87" y="560" font-size="18" font-weight="500" fill="#50695C">Results committed → Pages rebuilt</text><text x="87" y="585" font-size="18" font-weight="500" fill="#50695C">Challenge the same policy in the browser</text><text x="28" y="656" font-size="17" font-weight="500" fill="#50695C">Public information · Individual games · Provisional Elo</text></svg>
