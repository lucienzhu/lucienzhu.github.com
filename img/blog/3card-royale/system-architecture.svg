<svg xmlns="http://www.w3.org/2000/svg" width="560" height="884" viewBox="0 0 560 884" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">系统架构：四种核心、可见观察、网页与实验宿主</title><desc id="desc">系统架构：四种核心、可见观察、网页与实验宿主. 深圳花牌文章图解。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="884" fill="#EDF4EF"/><text x="24" y="48" font-size="32" fill="#10231B" font-weight="700" text-anchor="start">一套规则，独立核心</text><rect x="24" y="80" width="512" height="96" rx="12" fill="#0C2118" stroke="none"/><text x="280" y="120" font-size="30" fill="#EAF3EE" font-weight="700" text-anchor="middle">Standard Rules 1.0</text><text x="280" y="154" font-size="24" fill="#9DB5A8" font-weight="500" text-anchor="middle">规则 · 状态 · 合法动作</text><path d="M280 176v26m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="216" width="512" height="124" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="280" y="258" font-size="30" fill="#10231B" font-weight="700" text-anchor="middle">JavaScript · Python</text><text x="280" y="298" font-size="30" fill="#10231B" font-weight="700" text-anchor="middle">Rust · C++</text><text x="280" y="329" font-size="23" fill="#4F665A" font-weight="500" text-anchor="middle">独立实现，共同回放校验</text><path d="M280 340v26m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="512" height="132" rx="12" fill="#E2ECE5" stroke="none"/><text x="48" y="422" font-size="27" fill="#10231B" font-weight="700" text-anchor="start">策略只收可见信息</text><text x="48" y="464" font-size="26" fill="#16765F" font-weight="600" text-anchor="start">observation + legal actions</text><text x="48" y="497" font-size="23" fill="#4F665A" font-weight="500" text-anchor="start">对手暗手牌、牌堆顺序不可见</text><path d="M280 512v20H12v218h12M12 610h12" fill="none" stroke="#4F665A" stroke-width="2"/><rect x="24" y="552" width="512" height="116" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="594" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">网页 · JavaScript 核心</text><text x="48" y="635" font-size="27" fill="#4F665A" font-weight="500" text-anchor="start">Code AI / ONNX Worker</text><rect x="24" y="692" width="512" height="116" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="734" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">实验 · Python 核心</text><text x="48" y="775" font-size="27" fill="#4F665A" font-weight="500" text-anchor="start">Gymnasium / PyTorch</text><text x="24" y="856" font-size="23" fill="#4F665A" font-weight="500" text-anchor="start">全状态留在宿主，用于存档与校验</text></svg>
