<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title" xml:lang="zh-CN"><title id="title">从一份策略，到一个可挑战的对手</title><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="690" fill="#EDF4EF"/><text x="28" y="43" font-size="14" font-weight="700" fill="#B2365A">AI ARENA / 1.1</text><text x="28" y="82" font-size="24" font-weight="700" fill="#122820">从一份策略，到一个可挑战的对手</text><rect x="28" y="108" width="504" height="110" rx="14" fill="#F7FBF8" stroke="#C3D5CB"/><text x="46" y="139" font-size="16" font-weight="700" fill="#B2365A">01</text><text x="87" y="140" font-size="22" font-weight="700" fill="#122820">编写与验证</text><text x="87" y="170" font-size="18" font-weight="500" fill="#50695C">JavaScript 或 ONNX · 新策略 ID</text><text x="87" y="195" font-size="18" font-weight="500" fill="#50695C">对 Code AI 打 4 局 → validation.json</text><path d="M280 221v12m-5-5 5 5 5-5" fill="none" stroke="#8EAA9B" stroke-width="2"/><rect x="28" y="238" width="504" height="110" rx="14" fill="#F7FBF8" stroke="#C3D5CB"/><text x="46" y="269" font-size="16" font-weight="700" fill="#B2365A">02</text><text x="87" y="270" font-size="22" font-weight="700" fill="#122820">提交 PR</text><text x="87" y="300" font-size="18" font-weight="500" fill="#50695C">CI 重放四局验证，核对结果</text><text x="87" y="325" font-size="18" font-weight="500" fill="#50695C">检查能否对战；此时不评分</text><path d="M280 351v12m-5-5 5 5 5-5" fill="none" stroke="#8EAA9B" stroke-width="2"/><rect x="28" y="368" width="504" height="110" rx="14" fill="#F7FBF8" stroke="#C3D5CB"/><text x="46" y="399" font-size="16" font-weight="700" fill="#B2365A">03</text><text x="87" y="400" font-size="22" font-weight="700" fill="#122820">发布与评分</text><text x="87" y="430" font-size="18" font-weight="500" fill="#50695C">合并后：发布版本或手动运行</text><text x="87" y="455" font-size="18" font-weight="500" fill="#50695C">3 个固定基准 × 20 局 = 60 局</text><path d="M280 481v12m-5-5 5 5 5-5" fill="none" stroke="#8EAA9B" stroke-width="2"/><rect x="28" y="498" width="504" height="110" rx="14" fill="#E2ECE5" stroke="#C3D5CB"/><text x="46" y="529" font-size="16" font-weight="700" fill="#B2365A">04</text><text x="87" y="530" font-size="22" font-weight="700" fill="#122820">天梯与试玩</text><text x="87" y="560" font-size="18" font-weight="500" fill="#50695C">提交结果 → 重建 Pages</text><text x="87" y="585" font-size="18" font-weight="500" fill="#50695C">玩家挑战的，是同一份策略</text><text x="28" y="656" font-size="17" font-weight="500" fill="#50695C">公开信息 · 小局胜负 · 暂定基准 Elo</text></svg>
