<text x="52" y="443" font-size="16" font-weight="400" text-anchor="start" fill="#526B60">Excerpt: 1 allowed; 0 unavailable</text>
<text x="52" y="467" font-size="15" font-weight="400" text-anchor="start" fill="#526B60">Used cards / lower IDs turn 0; IDs stay fixed</text>
<rect x="507" y="263" width="461" height="222" rx="10" fill="#F7FBF8" stroke="#C4D7CB"/>
<text x="527" y="296" font-size="19" font-weight="700" text-anchor="start" fill="#10251C">Swap: source → destination → target</text>
<text x="527" y="333" font-size="17" font-weight="700" text-anchor="start" fill="#16765F">SWAP → 10♣ → RIVAL_WOUNDS → 3♠</text>
<text x="527" y="365" font-size="18" font-weight="400" text-anchor="start" fill="#526B60">[55, 34, 64, 1]</text>
<text x="527" y="401" font-size="16" font-weight="400" text-anchor="start" fill="#526B60">Deck / blind: no hidden target-card ID</text>
<text x="527" y="434" font-size="16" font-weight="400" text-anchor="start" fill="#526B60">SKIP: one chance · STOP: remaining chances</text>
<text x="527" y="466" font-size="15" font-weight="400" text-anchor="start" fill="#526B60">At most 6 tokens; remaining slots use PAD = 65</text>
<rect x="32" y="508" width="936" height="110" rx="10" fill="#E2ECE5" stroke="#C4D7CB"/>
<text x="52" y="544" font-size="20" font-weight="700" text-anchor="start" fill="#10251C">Current state 336 + prefix 396</text>
<text x="512" y="544" font-size="25" font-weight="700" text-anchor="start" fill="#16765F">→ 256 → 128 → 65</text>
<text x="52" y="586" font-size="17" font-weight="400" text-anchor="start" fill="#526B60">Shared MLP · conditional mask at every step · advance only after the complete move</text>
</g></svg>