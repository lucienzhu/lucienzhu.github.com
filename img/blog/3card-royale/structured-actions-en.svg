<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img"><title>Fixed actions and conditional masks</title><rect width="1000" height="650" fill="#EDF4EF"/><g font-family="Arial, sans-serif" fill="#10251C">
<text x="32" y="42" font-size="25" font-weight="700" text-anchor="start" fill="#10251C">Fixed meanings. Build one complete move.</text>
