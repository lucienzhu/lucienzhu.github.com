<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1000" viewBox="0 0 560 1000" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">The combat loop and game termination</title><desc id="desc">The combat loop and game termination. Explanatory figure for the 3Card Royale article.</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="1000" fill="#EDF4EF"/><text x="24" y="48" font-size="32" fill="#10231B" font-weight="700" text-anchor="start">One round, two encounters</text><rect x="24" y="80" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="124" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">01</text><text x="104" y="123" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Attacker plays</text><text x="104" y="159" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Three cards / four / five of a kind</text><path d="M280 180v26m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="220" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="264" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">02</text><text x="104" y="263" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Defender responds</text><text x="104" y="299" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Choose after seeing the attack</text><path d="M280 320v26m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="360" width="512" height="196" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="402" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">03  Compare and resolve</text><text x="48" y="448" font-size="27" fill="#B2365A" font-weight="600" text-anchor="start">Attack wins → wounds</text><text x="48" y="489" font-size="27" fill="#866300" font-weight="600" text-anchor="start">Defense wins → optional swaps</text><text x="48" y="530" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Exact tie → no gain</text><path d="M280 556v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="594" width="512" height="72" rx="12" fill="#F6E0E7" stroke="none"/><text x="280" y="638" font-size="28" fill="#B2365A" font-weight="700" text-anchor="middle">5+ wounds → game ends</text><text x="280" y="708" font-size="24" fill="#4F665A" font-weight="500" text-anchor="middle">Otherwise ↓</text><rect x="24" y="738" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="782" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">04</text><text x="104" y="781" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Switch roles</text><text x="104" y="817" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Repeat 01–03; no hand refill</text><path d="M280 838v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="876" width="512" height="100" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="920" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">05</text><text x="104" y="919" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Refill to 8 at round end</text><text x="104" y="955" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Keep unused cards; next round</text></svg>
