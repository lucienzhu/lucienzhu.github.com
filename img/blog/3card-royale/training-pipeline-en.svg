<svg xmlns="http://www.w3.org/2000/svg" width="560" height="936" viewBox="0 0 560 936" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Training and deployment of both behavior-cloning baselines</title><desc id="desc">Training and deployment of both behavior-cloning baselines. Explanatory figure for the 3Card Royale article.</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="936" fill="#EDF4EF"/><text x="24" y="48" font-size="31" fill="#10231B" font-weight="700" text-anchor="start">From self-play to the browser</text><rect x="24" y="80" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="125" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">01</text><text x="104" y="124" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">SDK Code AI × SDK Code AI</text><text x="104" y="164" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">10,000 games per recipe</text><path d="M280 192v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="230" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="275" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">02</text><text x="104" y="274" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">Split by whole game</text><text x="104" y="314" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">8,000 train / 1,000 val / 1,000 test</text><path d="M280 342v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="512" height="132" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="422" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">03</text><text x="104" y="422" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">PyTorch + TensorBoard</text><text x="104" y="459" font-size="21" fill="#4F665A" font-weight="500" text-anchor="start">Scoring: 408 → 256 → 128 → 1</text><text x="104" y="491" font-size="21" fill="#4F665A" font-weight="500" text-anchor="start">Autoreg.: 732 → 256 → 128 → 65</text><path d="M280 512v18m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="548" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="593" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">04</text><text x="104" y="592" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">Select by validation loss</text><text x="104" y="632" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">Scoring epoch 5 · Autoreg. epoch 16</text><path d="M280 660v22m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="700" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="745" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">05</text><text x="104" y="744" font-size="26" fill="#10231B" font-weight="700" text-anchor="start">ONNX → Web Worker</text><text x="104" y="784" font-size="22" fill="#4F665A" font-weight="500" text-anchor="start">0.55 / 0.92 MB · local inference</text><rect x="24" y="842" width="512" height="66" rx="12" fill="#E2ECE5" stroke="none"/><text x="280" y="883" font-size="26" fill="#10231B" font-weight="700" text-anchor="middle">actions-v2</text></svg>
