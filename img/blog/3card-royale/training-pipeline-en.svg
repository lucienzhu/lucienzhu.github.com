<svg xmlns="http://www.w3.org/2000/svg" width="560" height="936" viewBox="0 0 560 936" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Training and deployment of the behavior-cloning baseline</title><desc id="desc">Training and deployment of the behavior-cloning baseline. Explanatory figure for the 3Card Royale article.</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="560" height="936" fill="#EDF4EF"/><text x="24" y="48" font-size="31" fill="#10231B" font-weight="700" text-anchor="start">From self-play to the browser</text><rect x="24" y="80" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="125" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">01</text><text x="104" y="124" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Code AI × Code AI</text><text x="104" y="164" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">10,000 games · 252,859 decisions</text><path d="M280 192v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="230" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="275" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">02</text><text x="104" y="274" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Split by whole game</text><text x="104" y="314" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">8,000 train / 1,000 val / 1,000 test</text><path d="M280 342v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="380" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="425" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">03</text><text x="104" y="424" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">PyTorch + TensorBoard</text><text x="104" y="464" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Imitation · 408 → 256 → 128 → 1</text><path d="M280 492v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="530" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="575" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">04</text><text x="104" y="574" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">Select by validation loss</text><text x="104" y="614" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Epoch 5 · then test and play evaluation</text><path d="M280 642v24m-6-7 6 7 6-7" stroke="#4F665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="680" width="512" height="112" rx="12" fill="#F7FBF8" stroke="#C3D4C9"/><text x="48" y="725" font-size="28" fill="#B2365A" font-weight="700" text-anchor="start">05</text><text x="104" y="724" font-size="28" fill="#10231B" font-weight="700" text-anchor="start">ONNX → Web Worker</text><text x="104" y="764" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">0.55 MB weights · local inference</text><rect x="24" y="822" width="512" height="88" rx="12" fill="#E2ECE5" stroke="none"/><text x="48" y="859" font-size="25" fill="#10231B" font-weight="600" text-anchor="start">Released: learns Code AI actions</text><text x="48" y="893" font-size="24" fill="#4F665A" font-weight="500" text-anchor="start">Next: RL from win/loss rewards</text></svg>
