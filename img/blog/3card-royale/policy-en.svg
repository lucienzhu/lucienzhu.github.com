nt-size="20" fill="#4F665A" font-weight="400" text-anchor="middle">Action score</text><path d="M563 250h42m-10 -8 10 8-10 8" fill="none" stroke="#9DB5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M798 250h42m-10 -8 10 8-10 8" fill="none" stroke="#9DB5A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="445" font-size="22" fill="#4F665A" font-weight="400" text-anchor="middle">Score legal candidates → Pick the highest; mask unused slots</text></svg>
