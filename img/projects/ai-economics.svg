<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent resource exchange</title>
  <desc id="desc">Three agents exchange food, timber and stone. A conceptual illustration of the AI Economics environment design.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7d8b91"/>
    </marker>
    <g id="agent">
      <circle cy="-28" r="20"/>
      <path d="M-34 38V12C-34-16 34-16 34 12V38Z"/>
    </g>
    <g id="apple">
      <path d="M0-13C-26-28-40-4-23 18-15 29-6 24 0 24 7 24 17 29 25 17 40-7 23-27 0-13Z" fill="#ff563e"/>
      <path d="M0-13C-1-26 5-30 10-32" fill="none" stroke="#6b593f" stroke-width="5"/>
      <path d="M4-20C12-34 29-31 30-29 25-18 14-15 4-20Z" fill="#829d69"/>
    </g>
    <g id="timber">
      <path d="M-35-8 21-22 36-3-20 14Z" fill="#b48b59"/>
      <path d="M-20 14 36-3 36 13-20 30Z" fill="#8d653f"/>
      <path d="M-35-8-20 14-20 30-35 9Z" fill="#d5b285"/>
    </g>
    <g id="stone">
      <path d="M-33 17-25-12 0-25 31-7 37 17 9 28Z" fill="#a6b0b8"/>
      <path d="M-25-12 5-2 31-7 0-25Z" fill="#c7cfd5"/>
      <path d="M5-2 9 28 37 17 31-7Z" fill="#7c8995"/>
    </g>
  </defs>
  <path d="M139 322 360 50 581 322 360 447Z" fill="#f5f7f4"/>
  <g fill="none" stroke="#7d8b91" stroke-width="7" marker-end="url(#arrow)">
    <path d="M215 171 280 131"/>
    <path d="M437 131 505 210"/>
    <path d="M470 351 256 351"/>
    <path d="M175 258 232 194"/>
    <path d="M490 276 426 192"/>
    <path d="M269 315 446 315"/>
  </g>
  <use href="#agent" transform="translate(360 100)" fill="#314e63"/>
  <use href="#agent" transform="translate(166 332)" fill="#bf6a49"/>
  <use href="#agent" transform="translate(554 332)" fill="#6d865b"/>
  <use href="#apple" transform="translate(180 175) scale(.9)"/>
  <use href="#timber" transform="translate(540 177) scale(.9)"/>
  <use href="#stone" transform="translate(360 378) scale(.9)"/>
  <use href="#stone" transform="translate(404 82) scale(.35)"/>
  <use href="#apple" transform="translate(213 330) scale(.4)"/>
  <use href="#timber" transform="translate(597 328) scale(.4)"/>
</svg>
