---
layout: default
---
{% include locale.html %}
<!--hero unit-->
{% if page.featured_images %}
<div class="row">
    <div class="large-12 columns">
        <div class="slideshow-wrapper">
            {% for featured_image in page.featured_images %}
            <div><img src="{{ featured_image }}" alt="{{ page.title | escape }}"></div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
<!-- content -->
<main class="row paper-content">
    <div class="large-12 columns">
        {{ content }}
    </div>
</main>
