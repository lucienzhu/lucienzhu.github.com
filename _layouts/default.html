<!DOCTYPE html>
<!-- paulirish.com/2008/conditional-css-vs-css-hacks-answer-neither/ -->
<!--[if IE 8]>    <html class="no-js lt-ie9" lang="{{ page.lang | default: 'en' }}"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="{{ page.lang | default: 'en' }}"> <!--<![endif]-->
<head>
  <meta charset="utf-8" />
  <!-- Set the viewport width to device width for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  {% if page.article_url %}
  <meta name="description" content="{{ page.summary | escape }}">
  <link rel="canonical" href="{{ page.article_url }}">
  <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.article_url }}">
  <link rel="alternate" hreflang="{% if page.lang == 'zh-CN' %}en{% else %}zh-CN{% endif %}" href="https://lucienzhu.github.io{{ page.alternate_url }}">
  <meta property="og:type" content="article"><meta property="og:title" content="{{ page.title | escape }}"><meta property="og:description" content="{{ page.summary | escape }}">
  <meta property="og:url" content="{{ page.article_url }}"><meta property="og:image" content="https://lucienzhu.github.io{{ page.article_image }}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image"><meta property="article:published_time" content="2026-10-24T00:00:00+08:00">
  {% endif %}
  <!-- Included CSS Files (Uncompressed) -->
  <!--
  <link rel="stylesheet" href="/css/foundation.css">
  -->
  <!-- Included CSS Files (Compressed) -->
  <link rel="stylesheet" type="text/css" media="all" href="/css/foundation.min.css">
  <link rel="stylesheet" type="text/css" media="all" href="/css/foundation-icons.css">
  <link rel="stylesheet" type="text/css" media="all" href="/css/common.css">
  <link rel="stylesheet" type="text/css" media="all" href="/css/slick.css"/>
  
  <link rel="stylesheet" type="text/css" media="all" href="/css/index.css"/>
  <link rel="stylesheet" type="text/css" media="all" href="/css/post.css"/>

  <script type="text/javascript" src="//use.typekit.net/jnp1zqh.js"></script>
  <script type="text/javascript">try{Typekit.load();}catch(e){}</script>


  {% for css_name in page.extra_css %}
  <link rel="stylesheet" href="{{ css_name }}">
  {% endfor %}
  {% for js_name in page.extra_js %}
  <script type="text/javascript" src="{{js_name}}"></script>
  {% endfor %}
  <!-- Initialize JS Plugins -->
  <!--[if lt IE 8]>
  <link rel="stylesheet" href="stylesheets/general_foundicons_ie7.css">
  <![endif]-->
  <!--google analytics tracker code for xiaolongzhu.org-->
  <!-- Le fav and touch icons -->
  <link rel="shortcut icon" href="/css/favicon.ico">
  <link rel="apple-touch-icon" href="/css/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/css/apple-touch-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/css/apple-touch-icon-114x114.png">

  <script type="text/javascript" src="/js/default.js"></script>

  <script type="text/javascript">
  var _gaq = _gaq || [];
  _gaq.push(['_setAccount', 'UA-17034168-2']);
  _gaq.push(['_trackPageview']);
  (function() {
  var ga = document.createElement('script'); ga.type = 'text/javascript'; ga.async = true;
  ga.src = ('https:' == document.location.protocol ? 'https://ssl' : 'http://www') + '.google-analytics.com/ga.js';
  var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(ga, s);
  })();
  </script>
</head>
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}

  <script type="text/javascript" src="/js/vendor/jquery.js"></script>
  <script type="text/javascript" src="/js/vendor/modernizr.js"></script>
  <script type="text/javascript" src="/js/foundation.min.js"></script>
  <script type="text/javascript" src="/js/slick.min.js"></script>

  {% for js_name in page.extra_js_bottom %}
  <script type="text/javascript" src="{{js_name}}"></script>
  {% endfor %}
</body>
</html>
