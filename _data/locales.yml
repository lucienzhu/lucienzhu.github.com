  home:
    bio: 做有趣的 AI，偶尔也有用。
    portrait: 朱曉龍的照片
    intro: '我研发能学习、能玩、能与人协作的 AI 智能体。工作涉及多智能体学习、计算机视觉、机器学习系统和机器人，也长期关注<a href="https://en.wikipedia.org/wiki/Artificial_general_intelligence">通用人工智能（AGI）</a>。'
    current_work: '我研发了能与球员对打的<a href="%projects%#tennis-robot">网球机器人</a>，并与伙伴共同研发了群聊 AI 智能体 <a href="%projects%super-intern/">SuperIntern</a>，直接在聊天中解决营销和办公问题。'
    background: '我曾任<a href="https://chaocanshu.cn/">超参数科技</a>副总裁，探索游戏机器人、NPC、伙伴角色和大规模仿真。在腾讯 AI 平台部，我负责视觉工程团队，并与腾讯 AI Lab 的研究人员合作。'
    contributions: '我参与过围棋 AI <a href="https://zh.wikipedia.org/wiki/%E7%BB%9D%E8%89%BA">绝艺</a>的研发，2018 年曾担任 <a href="https://deeplearningfoundation.org/">LF Deep Learning Foundation</a> 技术顾问委员会成员。'
    research: '我在<a href="http://www.hku.hk">香港大学</a><a href="http://www.cs.hku.hk">计算机科学系</a>获得博士学位，导师是 <a href="http://i.cs.hku.hk/~kykwong/">Kenneth Wong 博士</a>。我的研究主要是彩色图像中的手部检测与定位，此前也研究过基于深度相机的手势识别。我喜欢用经济、可解释、可复现的方法解决现实问题。'
    interests: '除了研发 AI 系统，我也喜欢和真人一起玩桌游，偶尔设计自己的游戏，比如<a href="https://lucienzhu.github.io/3card-royale/?lang=zh-CN">深圳花牌</a>。我也会在 <a href="http://www.flickr.com/photos/xlzhu/">Flickr</a> 分享照片。'
    links_html: '你可以浏览我的<a href="%projects%">项目与研究</a>、阅读<a href="%updates%">动态</a>，或在 <a href="https://github.com/lucienzhu">GitHub</a> 上查看我的代码。'
    more: 更多动态…
