    bio: 做有趣的 AI
    groups: { recent: 近期项目, career: 职业经历, education: 教育与研究, personal: 工作之外 }
    portrait: 朱曉龍的照片
    intro: '我研发能学习、能玩、能与人协作的 AI，关注多智能体、计算机视觉、机器学习系统、机器人与<a href="https://en.wikipedia.org/wiki/Artificial_general_intelligence">通用人工智能（AGI）</a>。'
    robotics_work: '我研发了能与玩家对打、捡球、陪练的<a href="%projects%#tennis-robot">网球机器人产品</a>。'
    current_work: '与伦敦伙伴共同研发群聊 AI 智能体 <a href="%projects%super-intern/">SuperIntern</a>，在聊天中解决办公和营销问题。'
    background: '曾任<a href="https://chaocanshu.cn/">超参数科技</a>副总裁，参与游戏机器人、NPC、伙伴角色和大规模仿真的研发与商业化。'
    tencent_background: '此前在腾讯 AI Lab 工作，也曾负责腾讯 AI 平台部的视觉工程团队。'
    contributions: '参与围棋 AI <a href="https://zh.wikipedia.org/wiki/%E7%BB%9D%E8%89%BA">绝艺</a>研发，2018 年担任 <a href="https://deeplearningfoundation.org/">LF Deep Learning Foundation</a> 技术顾问委员会成员。'
    research: '我在<a href="http://www.hku.hk">香港大学</a><a href="http://www.cs.hku.hk">计算机科学系</a>获得博士学位，导师是 <a href="https://i.cs.hku.hk/~kykwong/" target="_blank" rel="noopener">Kenneth Wong 教授</a>，研究手部检测与识别。'
    undergraduate_research: '此前在北京大学读本科，跟随<a href="https://www.ai.pku.edu.cn/info/1312/2843.htm" target="_blank" rel="noopener">赵卉菁教授</a>研究智能车感知。'
    interests: '喜欢和真人玩桌游，也设计游戏，比如<a href="https://lucienzhu.github.io/3card-royale/?lang=zh-CN">深圳花牌</a>；照片分享在 <a href="http://www.flickr.com/photos/xlzhu/">Flickr</a>。'
    links_html: '你可以浏览我的<a href="%projects%">项目与研究</a>，或阅读<a href="%updates%">动态</a>。'
    more: 更多动态…
