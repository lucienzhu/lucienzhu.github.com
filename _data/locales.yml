  home:
    bio: Making interesting AIs
    groups: { recent: Recent work, career: Professional experience, education: Education and research, personal: Beyond work }
    portrait: Portrait of Xiaolong Zhu
    intro: 'I build AI agents that learn, play and work with people. My interests span multi-agent learning, computer vision, machine learning systems, robotics and <a href="https://en.wikipedia.org/wiki/Artificial_general_intelligence">AGI</a>.'
    robotics_work: 'I developed a <a href="%projects%#tennis-robot">tennis robot</a> for rallies, ball collection and practice.'
    current_work: 'With partners in London, I co-developed <a href="%projects%super-intern/">SuperIntern</a>, a group chat AI agent for marketing and productivity.'
    background: 'Previously, I was VP at <a href="https://chaocanshu.cn/">Parametrix.ai</a>, working on game bots, NPCs, companions and large-scale simulations, from R&D to commercialization.'
    tencent_background: 'Before that, I worked at Tencent AI Lab and led the vision engineering team in Tencent’s AI Platform Department.'
    contributions: 'I contributed to the Go AI <a href="https://zh.wikipedia.org/wiki/%E7%BB%9D%E8%89%BA">Fine Art</a> and served on the <a href="https://deeplearningfoundation.org/">LF Deep Learning Foundation</a> Technical Advisory Council in 2018.'
    research: 'I earned my Ph.D. in <a href="http://www.cs.hku.hk">Computer Science</a> at the <a href="http://www.hku.hk">University of Hong Kong</a>, advised by <a href="https://i.cs.hku.hk/~kykwong/" target="_blank" rel="noopener">Prof. Kenneth Wong</a>, researching hand detection and recognition.'
    undergraduate_research: 'Prior to that, I researched perception for intelligent vehicles at Peking University as an undergraduate, advised by <a href="https://www.ai.pku.edu.cn/info/1312/2843.htm" target="_blank" rel="noopener">Prof. Huijing Zhao</a>.'
    interests: 'I play board games in person and sometimes design them, including <a href="https://lucienzhu.github.io/3card-royale/?lang=en">3Card Royale</a>. I share photos on <a href="http://www.flickr.com/photos/xlzhu/">Flickr</a>.'
    links_html: 'Explore my <a href="%projects%">projects and research</a> or read my <a href="%updates%">updates</a>.'
    more: More updates…
