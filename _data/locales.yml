  home:
    bio: Bio
    portrait: Portrait of Xiaolong Zhu
    intro: 'I build AI for games and explore <a href="https://en.wikipedia.org/wiki/Artificial_general_intelligence">artificial general intelligence</a> and how intelligent agents interact with people. My work spans multi-agent systems, computer vision and applications of machine learning.'
    background: 'I previously served as Vice President at <a href="https://chaocanshu.cn/">Parametrix.ai</a>, working on game bots, NPCs, companions and large-scale simulations. At Tencent’s AI Platform Department, I led the vision engineering team and collaborated with Tencent AI Lab.'
    contributions: 'I contributed to the Go AI <a href="https://zh.wikipedia.org/wiki/%E7%BB%9D%E8%89%BA">Fine Art</a> and, in 2018, served on the Technical Advisory Council of the <a href="https://deeplearningfoundation.org/">LF Deep Learning Foundation</a>.'
    research: 'I earned my Ph.D. in the <a href="http://www.cs.hku.hk">Department of Computer Science</a> at <a href="http://www.hku.hk">the University of Hong Kong</a>, supervised by <a href="http://i.cs.hku.hk/~kykwong/">Dr. Kenneth Wong</a>. My research focused on hand detection and localization in color images, following earlier work on hand posture recognition with depth cameras. I enjoy solving real-world problems with economical, explainable and reproducible solutions.'
    links_html: 'Explore my <a href="%projects%">projects and research</a>, read my <a href="%updates%">updates</a>, or find my code on <a href="https://github.com/lucienzhu">GitHub</a>.'
    more: More updates…
